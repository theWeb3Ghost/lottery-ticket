[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = true
ast = true
build_info = true
optimizer = true
optimizer_runs = 200
remappings = [
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/',
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/',
    '@openzeppelin/contracts/=lib/chainlink-brownie-contracts/contracts/vendor/openzeppelin-solidity/v4.7.3/contracts/',
]

[profile.ci]
fuzz = { runs = 512 }
invariant = { runs = 256 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
